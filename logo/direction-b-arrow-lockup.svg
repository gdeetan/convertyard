<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <title>ConvertYard — Direction B: Convert Arrow</title>

  <!-- Mark: a file/document silhouette with a clean transformation arrow piercing through -->
  <g transform="translate(14, 16)">
    <!-- Document outline (folded corner) -->
    <path d="M 6 4 L 32 4 L 44 16 L 44 44 Q 44 48 40 48 L 6 48 Q 2 48 2 44 L 2 8 Q 2 4 6 4 Z"
          fill="none" stroke="#C2410C" stroke-width="3" stroke-linejoin="round"/>
    <!-- Folded corner accent -->
    <path d="M 32 4 L 32 16 L 44 16" fill="none" stroke="#C2410C" stroke-width="3" stroke-linejoin="round"/>
    <!-- Arrow piercing horizontally through the document -->
    <path d="M -2 28 L 48 28" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 42 22 L 50 28 L 42 34" fill="none" stroke="#C2410C" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="84" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="28" letter-spacing="-0.5" fill="#1C1917">
    <tspan font-weight="500">Convert</tspan><tspan font-weight="700">Yard</tspan>
  </text>
</svg>

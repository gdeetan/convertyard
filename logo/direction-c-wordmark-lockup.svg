<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <title>ConvertYard — Direction C: Wordmark</title>

  <!-- Pure wordmark, no mark. "convert" + colored dot + "yard" all lowercase for a modern technical feel -->
  <text x="20" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="32" letter-spacing="-0.8" font-weight="600" fill="#1C1917">convert</text>

  <!-- Dot accent in brand color, sized like a lowercase i dot -->
  <circle cx="150" cy="40" r="4" fill="#C2410C"/>

  <text x="162" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="32" letter-spacing="-0.8" font-weight="600" fill="#1C1917">yard</text>
</svg>
